name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Test and package
        run: bash ./gradlew --no-daemon clean build
      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: |
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: warn
      - name: Retain tested executable
        uses: actions/upload-artifact@v6
        with:
          name: scientific-csv-analyzer
          path: build/libs/scientific-csv-analyzer.jar
          if-no-files-found: error
