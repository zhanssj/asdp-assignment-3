name: Deliver versioned JAR

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Test and package release
        run: bash ./gradlew --no-daemon clean build
      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-test-reports
          path: build/reports/tests/test/
      - name: Publish tested JAR
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Use a semantic release tag such as v0.1.0.\n' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" build/libs/scientific-csv-analyzer.jar --verify-tag --generate-notes --title "Scientific CSV Data Analyzer $RELEASE_TAG"
