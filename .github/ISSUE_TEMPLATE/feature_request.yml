name: Feature request
description: Propose a scientific or usability improvement
title: "[Feature] "
body:
  - type: textarea
    id: purpose
    attributes:
      label: Scientific purpose
      description: Explain the user problem and a small example.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Describe observable behavior and a reference case that would verify the feature.
    validations:
      required: true
